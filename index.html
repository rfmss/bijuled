<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1410">
  <meta name="description" content="Match-3 com Fluent Emojis — combine rostinhos, invoque criaturas especiais e vença 50 fases.">
  <title>Bijuled</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=20260701a">
<script data-goatcounter="https://bijuled.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

  <!-- MENU -->
  <div id="screen-menu" class="screen active">
    <div class="menu-content">
      <div class="logo-block">
        <div class="logo-icon">
          <span class="logo-icon-emoji" aria-hidden="true">💎</span>
        </div>
        <h1 class="logo-title">Bijuled</h1>
        <p class="logo-sub">Combine. Cascade. Conquiste.</p>
      </div>

      <div class="menu-buttons">
        <button class="btn-primary btn-xl" id="btn-play">
          <span class="btn-icon-wrap">
            <span class="icon-emoji" aria-hidden="true">▶️</span>
          </span>
          Jogar
        </button>
        <button class="btn-secondary" id="btn-levels">
          <span class="btn-icon-wrap">
            <span class="icon-emoji" aria-hidden="true">🗂️</span>
          </span>
          Selecionar Fase
        </button>
      </div>

      <div class="menu-footer">
        <span class="version-tag">v1.0 · 50 Fases</span>
      </div>
    </div>
  </div>

  <!-- LEVEL SELECT -->
  <div id="screen-levels" class="screen">
    <div class="screen-header-bar">
      <button class="btn-back" id="btn-back-menu">
        <span class="icon-emoji icon-emoji-sm" aria-hidden="true">⬅️</span>
      </button>
      <h2 class="screen-title">Fases</h2>
      <div class="header-spacer"></div>
    </div>
    <div class="chapter-scroll">
      <div id="levels-container"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="game-wrapper">

      <div class="game-hud">
        <div class="hud-btn-group">
          <button class="hud-btn" id="btn-pause">
            <span class="icon-emoji icon-emoji-sm" aria-hidden="true">⏸️</span>
          </button>
          <button class="hud-btn" id="btn-radio" title="Ligar/Desligar rádio">
            <span id="icon-sound-on" class="icon-emoji icon-emoji-sm" aria-hidden="true">🔊</span>
            <span id="icon-sound-off" class="icon-emoji icon-emoji-sm" aria-hidden="true" style="display:none">🔇</span>
          </button>
        </div>
        <div class="hud-stats">
          <div class="hud-stat">
            <span class="hud-label">Fase</span>
            <span class="hud-value" id="hud-level">1</span>
          </div>
          <div class="hud-stat">
            <span class="hud-label">Pontos</span>
            <span class="hud-value gold" id="hud-score">0</span>
          </div>
          <div class="hud-stat">
            <span class="hud-label">Jogadas</span>
            <span class="hud-value" id="hud-moves">—</span>
          </div>
        </div>
        <div class="hud-lives" id="hud-lives">
          <span class="life-heart active">&#9829;</span>
          <span class="life-heart active">&#9829;</span>
          <span class="life-heart active">&#9829;</span>
        </div>
      </div>

      <div class="objective-strip">
        <div class="obj-text" id="obj-text">Alcance 500 pontos</div>
        <div class="obj-progress-wrap">
          <div class="obj-progress-bar">
            <div class="obj-progress-fill" id="obj-fill" style="width:0%"></div>
          </div>
          <span class="obj-percent" id="obj-percent">0%</span>
        </div>
      </div>

      <div class="board-container">
        <div class="board-frame">
          <div id="compliment-display" class="compliment-display"></div>
          <div class="game-board" id="game-board"></div>
          <canvas id="particle-canvas"></canvas>
        </div>
      </div>

      <div class="boosts-bar">

        <!-- REMOVER: tap to activate, then tap a gem to destroy it -->
        <button class="boost-btn boost-hammer-btn" id="boost-hammer" data-type="hammer">
          <span class="boost-count" id="boost-count-hammer">3</span>
          <div class="boost-icon-wrap">
            <span class="boost-icon boost-icon-hammer boost-icon-emoji" aria-hidden="true">🔨</span>
            <!-- impact stars that appear on active -->
            <div class="boost-impact-stars">
              <span class="star s1">&#10022;</span>
              <span class="star s2">&#10022;</span>
              <span class="star s3">&#10022;</span>
            </div>
          </div>
          <span class="boost-label">Remover</span>
          <span class="boost-hint">toque 1 pedra</span>
        </button>

        <!-- MISTURAR: immediately shuffles all gems -->
        <button class="boost-btn boost-shuffle-btn" id="boost-shuffle" data-type="shuffle">
          <span class="boost-count" id="boost-count-shuffle">2</span>
          <div class="boost-icon-wrap">
            <span class="boost-icon boost-icon-shuffle boost-icon-emoji" aria-hidden="true">🔀</span>
          </div>
          <span class="boost-label">Misturar</span>
          <span class="boost-hint">embaralha tudo</span>
        </button>

        <!-- BOMBA: tap to activate, then tap a gem to blast 3×3 area -->
        <button class="boost-btn boost-bomb-btn" id="boost-bomb" data-type="bomb">
          <span class="boost-count" id="boost-count-bomb">1</span>
          <div class="boost-icon-wrap">
            <span class="boost-icon boost-icon-bomb boost-icon-emoji" aria-hidden="true">💣</span>
            <!-- explosion ring -->
            <div class="boost-explosion-ring"></div>
          </div>
          <span class="boost-label">Bomba</span>
          <span class="boost-hint">explode 3×3</span>
        </button>

      </div>

    </div>
  </div>

  <!-- PAUSE OVERLAY -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="overlay-backdrop"></div>
    <div class="overlay-card">
      <div class="overlay-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 256 256" fill="#d97757"><path d="M200,32H160a16,16,0,0,0-16,16V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm0,176H160V48h40ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Zm0,176H56V48H96Z"/></svg>
      </div>
      <h2 class="overlay-title">Pausado</h2>
      <div class="overlay-actions">
        <button class="btn-primary" id="btn-resume">Continuar</button>
        <button class="btn-ghost" id="btn-restart">Reiniciar Fase</button>
        <button class="btn-ghost" id="btn-quit">Ir ao Menu</button>
      </div>
    </div>
  </div>

  <!-- LEVEL COMPLETE -->
  <div id="overlay-complete" class="overlay hidden">
    <div class="overlay-backdrop"></div>
    <div class="overlay-card">
      <div class="stars-row" id="stars-row">
        <span class="star" id="star-1">&#9733;</span>
        <span class="star" id="star-2">&#9733;</span>
        <span class="star" id="star-3">&#9733;</span>
      </div>
      <h2 class="overlay-title">Fase Concluída!</h2>
      <div class="complete-score">
        <span class="complete-score-label">Pontuação</span>
        <span class="complete-score-value" id="complete-score">0</span>
      </div>
      <div class="overlay-actions">
        <button class="btn-primary" id="btn-next-level">Próxima Fase</button>
        <button class="btn-ghost" id="btn-replay">Repetir</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overlay-gameover" class="overlay hidden">
    <div class="overlay-backdrop"></div>
    <div class="overlay-card">
      <div class="overlay-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 256 256" fill="#d97757"><path d="M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>
      </div>
      <h2 class="overlay-title">Fim de Jogo</h2>
      <p class="overlay-sub" id="gameover-msg">Sem movimentos disponíveis</p>
      <div class="overlay-actions">
        <button class="btn-primary" id="btn-try-again">Tentar Novamente</button>
        <button class="btn-ghost" id="btn-goto-menu">Ir ao Menu</button>
      </div>
    </div>
  </div>

  <!-- COMBO -->
  <div id="combo-popup" class="combo-popup hidden">
    <span id="combo-text">COMBO x2!</span>
  </div>

  <script>
  // Random bg from rfmss palette
  var BG = ['#b2c9c3','#c9bfb0','#b8c4ce','#c4bac9','#c9c4b0','#b8c9b8','#cec0b4'];
  document.body.style.backgroundColor = BG[Math.floor(Math.random() * BG.length)];
  </script>

  <script>
  // PWA: funciona offline após a primeira visita (iOS 9 ignora, sem SW lá)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js');
    });
  }
  </script>

  <script src="js/gems.js?v=20260701a"></script>
  <script src="js/levels.js?v=20260701a"></script>
  <script src="js/board.js?v=20260701a"></script>
  <script src="js/game.js?v=20260701a"></script>
  <script src="js/radio.js?v=20260701a"></script>
  <script src="js/compliments.js?v=20260701a"></script>
</body>
</html>
